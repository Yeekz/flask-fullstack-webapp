{% extends "base.html" %}
{% block title %}Inscription — TaskFlow{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Créer un compte</h2>
    <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" name="username" required
               minlength="3" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Mot de passe <small>(min. 8 caractères)</small></label>
        <input type="password" id="password" name="password" required
               minlength="8" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-full">S'inscrire</button>
    </form>
    <p class="auth-switch">
      Déjà un compte ? <a href="{{ url_for('auth.login') }}">Se connecter</a>
    </p>
  </div>
</div>
{% endblock %}
